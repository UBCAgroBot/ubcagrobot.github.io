assert_lefthook_installed: true
colors: false

pre-commit:
  jobs:
    - name: format
      run: bash scripts/lefthook-fmt.sh
      stage_fixed: true

    - name: lint
      run: bash scripts/lefthook-lint.sh
      stage_fixed: true

commit-msg:
  commands:
    commit-lint:
      run: bash pre-commit.sh {1}
      fail_text: Commit message does not follow Conventional Commits style.

pre-push:
  jobs:
    - name: check fmt
      run: bash scripts/lefthook-fmt.sh --check
      fail_text: "Format check failed, run `bun run fmt`"

    - name: check lint
      run: bash scripts/lefthook-lint.sh --check
      fail_text: "Lint check failed, run `bun run lint`"

    - name: check build
      run: bash scripts/lefthook-build.sh
      fail_text: "Build check failed, run `bun run build:check`"
